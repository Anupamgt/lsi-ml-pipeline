[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsi-ml-pipeline"
version = "0.1.0"
description = "Landslide Susceptibility Index ML Pipeline — IIT Patna"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "geopandas>=0.14",      # optional, for spatial ops
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
lsi-pipeline = "run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lsi_pipeline*"]
