[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsi-ml-pipeline"
version = "0.1.0"
description = "Landslide Susceptibility Index ML Pipeline — IIT Patna"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "xgboost>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
# Phase 0 stack/audit use core rasterio+numpy. Stage A VLM backends + tiles.
vlm = [
    "Pillow>=10.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "openai>=1.40",
]

[project.scripts]
lsi-pipeline = "run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lsi_pipeline*", "lsi_vlm*"]
